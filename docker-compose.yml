services:
  postgres:
    image: postgres:16-alpine
    container_name: metrix-postgres
    environment:
      POSTGRES_DB: stock_analysis
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - metrix-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stock_analysis"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: Metrix-Server
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/stock_analysis
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - metrix-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: Metrix-Frontend
    ports:
      - "80:80"
    depends_on:
      - app
    networks:
      - metrix-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  metrix-network:
    driver: bridge
