map $http_upgrade $connectionUpgrade {
    default upgrade;
    '' '';
}

# Caddy 负责公网 TLS；本机 HTTP 检查仍使用 $scheme。
map $http_x_forwarded_proto $forwardedProto {
    default $scheme;
    https https;
    http http;
}

# WebSocket token 位于查询参数中，访问日志只记录路径。
log_format metrix '$remote_addr - $remote_user [$time_local] '
                  '"$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log /var/log/nginx/access.log metrix;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss;

    location /api/ {
        # Docker DNS 动态解析，后端重建后不需重启前端。
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backendUrl http://app:8080;
        proxy_pass $backendUrl$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwardedProto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connectionUpgrade;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /actuator {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
